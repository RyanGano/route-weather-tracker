<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When to Drive</title>
    <style>
      /* Critical inline background to avoid white flash before app mounts */
      html, body, #root { height: 100%; margin: 0; }
      @media (prefers-color-scheme: dark) {
        html, body { background-color: #0b1220; }
      }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #ffffff; }
      }
    </style>
    <!-- AdSense script is loaded dynamically by the app only when an ad slot
         is actually rendered (i.e. after the user selects a route). This
         prevents loading ad runner if no route has been chosen. -->
    <script>
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        document.documentElement.setAttribute(
          "data-bs-theme",
          mq.matches ? "dark" : "light",
        );
        mq.addEventListener("change", function (e) {
          document.documentElement.setAttribute(
            "data-bs-theme",
            e.matches ? "dark" : "light",
          );
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- No static hero here — App renders the hero within the React root. -->

    <!-- Load the dev module only on localhost; production should serve a built bundle. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
