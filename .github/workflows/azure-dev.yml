name: Deploy Route Weather Tracker

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize deploys of the same ref so two pushes in quick succession can't
# race each other onto App Service / Static Web Apps.
# cancel-in-progress is deliberately false: this workflow deploys, and killing
# a deploy mid-flight can leave the target half-updated. Queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job adds only what it actually needs.
permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    # Federated credentials (OIDC) — no long-lived secrets needed for Azure auth.
    # Only this job authenticates to Azure that way.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Publish
        run: dotnet publish route-weather-tracker-service/route-weather-tracker-service.csproj -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          package: ./publish

  deploy-frontend:
    runs-on: ubuntu-latest
    # Uses a deployment token rather than OIDC, so no id-token here. The SWA
    # action posts status back to the PR/commit, hence pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: route-weather-tracker-app/.nvmrc
          cache: "npm"
          cache-dependency-path: route-weather-tracker-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: route-weather-tracker-app

      - name: Deploy to Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: route-weather-tracker-app
          output_location: dist
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ADS_ENABLED: ${{ vars.VITE_ADS_ENABLED }}
          VITE_AMAZON_ASSOCIATE_TAG: ${{ vars.VITE_AMAZON_ASSOCIATE_TAG }}
          VITE_BOOKING_AFFILIATE_ID: ${{ vars.VITE_BOOKING_AFFILIATE_ID }}
          VITE_ADSENSE_PUBLISHER_ID: ${{ vars.VITE_ADSENSE_PUBLISHER_ID }}
          VITE_ADSENSE_AD_UNIT_ID: ${{ vars.VITE_ADSENSE_AD_UNIT_ID }}
